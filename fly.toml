# fly.toml app configuration file generated for finnavigator on 2026-05-08T21:48:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'finnavigator'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  FINNAV_WEB_ORIGIN = 'https://app.finnavigator.example'
  LLM_BACKEND = 'nvidia'
  PERSIST_DIRECTORY = '/data/chroma_db'
  PORT = '8000'

[[mounts]]
  source = 'finnav_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
