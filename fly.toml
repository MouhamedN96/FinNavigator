# Fly.io config for the FinNavigator API server.
# Deploy:
#   fly launch --no-deploy   (only first time, accept this fly.toml)
#   fly secrets set NVIDIA_API_KEY=… SEC_API_KEY=… ALPHA_VANTAGE_KEY=… STOCKFIT_API_KEY=… VOICEFLOW_API_KEY=…
#   fly deploy

app = "finnavigator-api"
primary_region = "iad"  # change to your nearest region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  LLM_BACKEND = "nvidia"          # cloud default — uses NVIDIA NIM
  PERSIST_DIRECTORY = "/data/chroma_db"
  FINNAV_WEB_ORIGIN = "https://app.finnavigator.example"  # CORS allowlist; set to your Pages URL

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

[[mounts]]
  source = "finnav_data"
  destination = "/data"          # Chroma RAG store persisted across restarts
